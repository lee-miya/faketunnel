# 开发示例：仅绑定本机。生产环境请改为公网地址、真实证书与独立 token。
listen: "127.0.0.1:8443"
token: "dev-token-change-me"
tls:
  auto_self_signed: true
  cert: "../certs/edge.crt"
  key: "../certs/edge.key"
allowlist_file: "allowlist.json"
health_path: "/healthz"
admin:
  listen: "127.0.0.1:9090"
  token: "admin-dev-token-change-me"
  # metrics: true   # 默认开启 /metrics（需 Bearer）
tunnels:
  - name: echo
    type: tcp
    public: "127.0.0.1:2222"
    local: "127.0.0.1:9000"
  - name: web
    type: http
    public: "127.0.0.1:8080"
    host: "web.localhost"
    local: "127.0.0.1:3000"
  - name: web-tls
    type: http
    public: "127.0.0.1:8444"
    tls: true
    host: "secure.localhost"
    local: "127.0.0.1:3000"
  # HTTP/2 端到端透传：Edge 不解密，按 SNI 把 TLS 拼到源站（源站需证书且支持 h2）
  - name: web-h2
    type: http
    public: "127.0.0.1:8445"
    tls: true
    passthrough: true
    host: "h2.localhost"
    local: "127.0.0.1:3443"
  - name: dns-demo
    type: udp
    # 5353 是 mDNS，桌面 Linux 上常被 Avahi 占用
    public: "127.0.0.1:5354"
    local: "127.0.0.1:9053"
log_level: info
# idle_timeout: 5m
# max_sessions: 1024
# proxy_protocol: false
