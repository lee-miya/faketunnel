# 开发示例：本机回环。生产请用 `faketunnel init`，并更换 token。
#
# 启动：
#   ./bin/edge  -config configs/examples/edge.yaml
#   ./bin/agent -config configs/examples/agent.yaml
# 源站准备与 curl 示例见 docs/usage.md 第 4 节。
#
# 未写出的项使用默认值：Admin 127.0.0.1:9090、allowlist.json、隧道 TLS 自签证书。
# 证书生成在本文件旁：configs/examples/certs/edge.crt（不是仓库根下的 configs/certs/）。
# 隧道 name 可省略；这里写上是为了日志和 Agent 覆盖时好看。
# 占位 token 仅供本机试用，上公网前必须更换。

listen: "127.0.0.1:8443"
token: "dev-token-change-me"
admin:
  token: "admin-dev-token-change-me"
health_path: "/healthz"
tunnels:
  # TCP：纯数字 local = 127.0.0.1:9000
  - name: echo
    public: "127.0.0.1:2222"
    local: 9000
  # HTTP/1：必须带 Host: web.localhost（写了 host 就不能用裸 IP 访问）
  - name: web
    public: "127.0.0.1:8080"
    host: "web.localhost"
    local: 3000
  # HTTPS 终止：Edge 解密后再拨 local
  - name: web-tls
    public: "127.0.0.1:8444"
    tls: true
    host: "secure.localhost"
    local: 3000
  # HTTP/2 端到端：Edge 不解密，按 SNI 拼到源站（源站需证书且支持 h2）
  - name: web-h2
    public: "127.0.0.1:8445"
    tls: true
    passthrough: true
    host: "h2.localhost"
    local: 3443
  # UDP 必须显式 type: udp
  - name: dns-demo
    type: udp
    public: "127.0.0.1:5354"
    local: 9053
