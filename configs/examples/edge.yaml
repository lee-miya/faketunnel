# 开发示例：仅绑定本机。生产环境请改为公网地址、真实证书与独立 token。
listen: "127.0.0.1:8443"
token: "dev-token-change-me"
tls:
  auto_self_signed: true
  cert: "../certs/edge.crt"
  key: "../certs/edge.key"
allowlist_file: "allowlist.json"
tunnels:
  - name: echo
    type: tcp
    public: "127.0.0.1:2222"
    local: "127.0.0.1:9000"
log_level: info
# idle_timeout: 5m
# max_sessions: 1024
# proxy_protocol: false
